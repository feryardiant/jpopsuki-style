name: Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: Pages
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup node
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build
      run: |
        npm run build
        npm run minify
        cp .gitignore public/

    - name: Store
      uses: actions/upload-pages-artifact@v5
      with:
        path: public

    - name: Deploy
      id: deployment
      if: github.event_name == 'push'
      uses: actions/deploy-pages@v5
      with:
        token: ${{ github.token }}
